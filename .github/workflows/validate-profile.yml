name: Validate profile

on:
  pull_request:
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - name: Compile generators
        run: |
          python3 -m py_compile scripts/generate_telemetry.py
          python3 -m py_compile scripts/generate_activity_world.py scripts/activity_world_model.py scripts/activity_world_titan.py scripts/activity_world_render.py
      - name: Test Activity World generator
        run: |
          python3 -m unittest tests.test_generate_activity_world -v
          python3 -m unittest tests.test_titan_face_direction_v7 -v
      - name: Validate local assets and README references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          root = Path('.')
          readme = (root / 'README.md').read_text(encoding='utf-8')
          required = [root/'assets/identity-headboard.svg',root/'assets/dave-command-core.svg',root/'assets/activity-world.svg',root/'assets/execution-loop.svg',root/'assets/tool-deck.svg',root/'assets/telemetry.svg',root/'profile-3d-contrib/profile-night-rainbow.svg',root/'profile-3d-contrib/profile-gitblock.svg']
          for path in required: assert path.is_file(), f'missing required asset: {path}'
          image_sources = re.findall(r'(?:src|srcset)="([^"\s]+)', readme)
          assert image_sources
          for source in image_sources:
              assert source.startswith('./'), f'unapproved external profile image source: {source}'
              assert (root/source[2:]).is_file(), f'broken local README asset reference: {source}'
          for tag in re.findall(r'<img\b[^>]*>', readme, flags=re.I):
              assert re.search(r'\balt="[^\"]+"', tag), f'image missing alt: {tag}'
          for token in ['github-readme-stats.vercel.app','github-readme-streak-stats','streak-stats.demolab.com','readme-typing-svg','capsule-render.vercel.app','skillicons.dev','komarev.com/ghpvc']:
              assert token not in readme
          assert '@gmail.com' not in readme.lower()
          assert 'dave-agent-os' not in readme
          assert './assets/activity-world.svg' not in readme, 'Activity World is intentionally hidden from the public profile'
          assert 'ACTIVITY WORLD' not in readme and 'TITAN' not in readme, 'hidden mascot copy leaked into the public profile'
          hierarchy=['./assets/identity-headboard.svg','./profile-3d-contrib/profile-night-rainbow.svg','./assets/dave-command-core.svg','## `02 // SIGNAL`']
          offsets=[readme.index(marker) for marker in hierarchy]
          assert offsets == sorted(offsets), f'profile hero hierarchy regressed: {list(zip(hierarchy, offsets))}'
          displayed={root/source[2:] for source in image_sources if source.endswith('.svg')}
          for path in displayed | set((root/'assets').glob('*.svg')):
              text=path.read_text(encoding='utf-8'); ET.fromstring(text); lower=text.lower()
              assert '<script' not in lower and 'javascript:' not in lower
              assert not re.search(r'\bon[a-z]+\s*=', lower), f'inline event handler: {path}'
          headboard=(root/'assets/identity-headboard.svg').read_text(encoding='utf-8')
          for marker in ('AARON SLUTSKY','@coolguytuff','sponge-cameo','platypus-cameo','id="edgeFade"','@media (prefers-color-scheme: light)'):
              assert marker in headboard, f'headboard lost {marker}'
          activity=(root/'assets/activity-world.svg').read_text(encoding='utf-8')
          for marker in ('BRICK_ROUTE_FORWARD','BRICK_ROUTE_REVERSE','BRICK_STATE_JUMP','BRICK_STATE_CLIMB','BRICK_STATE_SPRINT','BRICK_STATE_TURN','COLUMN_SETTLE','TITAN_BODY_DEPTH','TOWER_TOP_FACE','TOWER_FRONT_FACE','TOWER_SIDE_FACE','camera-follow','ACTIVITY WORLD // TITAN RUN'):
              assert marker in activity, f'Activity World lost {marker}'
          telemetry=(root/'assets/telemetry.svg').read_text(encoding='utf-8')
          percentages=[int(v) for v in re.findall(r'>(\d+)%</text>', telemetry)]
          assert percentages and sum(percentages)==100
          dave=(root/'assets/dave-command-core.svg').read_text(encoding='utf-8')
          assert '<animate' in dave and 'dur="28s"' in dave
          print('public profile hierarchy, hidden Activity World, assets, accessibility and SVG safety validated')
          PY
      - name: Generate telemetry against GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          TELEMETRY_OUT: /tmp/telemetry.svg
        run: python3 scripts/generate_telemetry.py
      - name: Validate generated telemetry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          text=Path('/tmp/telemetry.svg').read_text(encoding='utf-8'); ET.fromstring(text)
          percentages=[int(v) for v in re.findall(r'>(\d+)%</text>', text)]
          if percentages: assert sum(percentages)==100
          assert '<script' not in text.lower() and 'javascript:' not in text.lower()
          PY
      - name: Validate workflow hardening invariants
        run: |
          set -euo pipefail
          workflows=(.github/workflows/profile-assets.yml .github/workflows/snake.yml)
          if grep -En '@latest|git add -A|pull_request_target' "${workflows[@]}"; then exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          for workflow in (Path('.github/workflows/profile-assets.yml'),Path('.github/workflows/snake.yml')):
              for line in workflow.read_text(encoding='utf-8').splitlines():
                  stripped=line.strip()
                  if stripped.startswith('uses:'):
                      assert re.fullmatch(r'[0-9a-f]{40}', stripped.split('@',1)[-1]), f'unpinned action: {stripped}'
          PY
          grep -Fq 'contents: read' .github/workflows/profile-assets.yml
          grep -Fq 'contents: write' .github/workflows/profile-assets.yml
          grep -Fq 'git add -- profile-3d-contrib assets/telemetry.svg assets/activity-world.svg' .github/workflows/profile-assets.yml
          echo 'workflow hardening invariants validated'
