name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a

      - name: Generate contribution snake SVGs
        uses: Platane/snk/svg-only@a041d6c27ba561a39f5be9c26a784812765e434b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#7ff0ff

      - name: Publish only generated SVGs to output branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/profile-snake
          cp dist/github-contribution-grid-snake.svg /tmp/profile-snake/
          cp dist/github-contribution-grid-snake-dark.svg /tmp/profile-snake/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan snake-output
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp /tmp/profile-snake/*.svg .
          git add -- github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "chore: refresh contribution snake"
          git push --force origin HEAD:output
