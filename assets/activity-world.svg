<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-label="Cinematic 3D Activity World preview with TITAN traversing contribution block terrain"><defs><linearGradient id="bg"><stop stop-color="#01040a"/><stop offset="1" stop-color="#071321"/></linearGradient><radialGradient id="g"><stop stop-color="#baffbd"/><stop offset=".35" stop-color="#43c956"/><stop offset="1" stop-color="#0a4b22"/></radialGradient><linearGradient id="e"><stop stop-color="#7ff0ff"/><stop offset="1" stop-color="#b784ff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1600" height="820" fill="url(#bg)"/><g font-family="ui-monospace,monospace"><text x="62" y="62" fill="#e2fcff" font-size="20" font-weight="700" letter-spacing="3">ACTIVITY WORLD // TITAN RUN</text><text x="62" y="90" fill="#70869b" font-size="11">REAL CONTRIBUTION SIGNAL → CINEMATIC FOLLOW-CAM BLOCK TERRAIN</text></g><!-- BRICK_ROUTE_FORWARD --><!-- BRICK_ROUTE_REVERSE --><!-- BRICK_STATE_JUMP --><!-- BRICK_STATE_CLIMB --><!-- BRICK_STATE_SPRINT --><!-- BRICK_STATE_TURN --><!-- COLUMN_SETTLE --><g id="camera-follow"><animateTransform attributeName="transform" type="translate" values="0 0;-180 0;0 0" dur="12s" repeatCount="indefinite"/><g id="terrain"><g transform="translate(480 620)"><!-- TOWER_FRONT_FACE --><polygon points="-70,-100 70,-100 70,0 -70,0" fill="#173b7b"/><!-- TOWER_SIDE_FACE --><polygon points="70,-100 105,-125 105,-25 70,0" fill="#0c244d"/><!-- TOWER_TOP_FACE --><polygon points="-70,-100 70,-100 105,-125 -35,-125" fill="#3472de" stroke="#b5fbff" stroke-opacity=".5"/></g><g transform="translate(690 620)"><polygon points="-70,-150 70,-150 70,0 -70,0" fill="#1b4d74"/><polygon points="70,-150 105,-175 105,-25 70,0" fill="#0d304a"/><polygon points="-70,-150 70,-150 105,-175 -35,-175" fill="#268ca0" stroke="#b5fbff" stroke-opacity=".5"/><animateTransform attributeNa