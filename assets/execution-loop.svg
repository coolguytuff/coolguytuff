<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Dave execution loop: intent, reason, plan, act, evidence, evaluate, ship or recover">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#020617"/><stop offset=".55" stop-color="#07111f"/><stop offset="1" stop-color="#02040b"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7ff0ff" stop-opacity=".1"/><stop offset=".48" stop-color="#7ff0ff"/><stop offset=".72" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472d0" stop-opacity=".08"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#6d8cff" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect width="1200" height="420" rx="24" fill="url(#grid)"/>
<g font-family="IBM Plex Mono,JetBrains Mono,ui-monospace,monospace"><text x="42" y="52" fill="#d8faff" font-size="17" font-weight="700" letter-spacing="3">EXECUTION // CLOSED LOOP</text><text x="42" y="75" fill="#64748b" font-size="9.5" letter-spacing="1.7">INTENT BECOMES ACTION • ACTION BECOMES EVIDENCE • EVIDENCE CHANGES THE NEXT DECISION</text></g>
<path d="M94 205H1080" stroke="#142238" stroke-width="12" stroke-linecap="round"/><path d="M94 205H1080" stroke="url(#edge)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="12 10"><animate attributeName="stroke-dashoffset" values="0;-44" dur="5s" repeatCount="indefinite"/></path><circle r="5" fill="#fff" filter="url(#glow)"><animateMotion dur="8.5s" repeatCount="indefinite" path="M94 205H1080"/></circle>
<g font-family="IBM Plex Mono,JetBrains Mono,ui-monospace,monospace" text-anchor="middle">
  <g transform="translate(110 205)"><circle r="42" fill="#07111f" stroke="#7ff0ff" stroke-opacity=".65"/><circle r="5" fill="#7ff0ff" filter="url(#glow)"/><text y="72" fill="#d8faff" font-size="11" font-weight="700">INTENT</text><text y="90" fill="#64748b" font-size="8.5">OBJECTIVE</text></g>
  <g transform="translate(270 205)"><circle r="42" fill="#07111f" stroke="#4a7bff" stroke-opacity=".65"/><path d="M-12 8L0-15 13 8 0 15Z" fill="none" stroke="#4a7bff"/><text y="72" fill="#d8faff" font-size="11" font-weight="700">REASON</text><text y="90" fill="#64748b" font-size="8.5">CONTEXT</text></g>
  <g transform="translate(430 205)"><circle r="42" fill="#07111f" stroke="#6d8cff" stroke-opacity=".65"/><path d="M-16-9H16M-16 0H9M-16 9H3" stroke="#6d8cff"/><text y="72" fill="#d8faff" font-size="11" font-weight="700">PLAN</text><text y="90" fill="#64748b" font-size="8.5">SEQUENCE</text></g>
  <g transform="translate(590 205)"><circle r="46" fill="#081120" stroke="#a78bfa" stroke-opacity=".78"/><path d="M-15 0H10M2-8L11 0 2 8" fill="none" stroke="#a78bfa" stroke-width="2"/><circle r="27" fill="none" stroke="#a78bfa" stroke-opacity=".22"><animate attributeName="r" values="25;34;25" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".4;.08;.4" dur="3.2s" repeatCount="indefinite"/></circle><text y="76" fill="#fff" font-size="11" font-weight="700">ACT</text><text y="94" fill="#8b7ca8" font-size="8.5">TOOLS / AGENTS</text></g>
  <g transform="translate(750 205)"><circle r="42" fill="#07111f" stroke="#7ff0ff" stroke-opacity=".58"/><path d="M-15-10H15V10H-15Z M-8-3H8M-8 4H3" fill="none" stroke="#7ff0ff"/><text y="72" fill="#d8faff" font-size="11" font-weight="700">EVIDENCE</text><text y="90" fill="#64748b" font-size="8.5">OBSERVE</text></g>
  <g transform="translate(910 205)"><circle r="42" fill="#07111f" stroke="#6ee7b7" stroke-opacity=".62"/><path d="M-15 0L-5 10 16-12" fill="none" stroke="#6ee7b7" stroke-width="2"/><text y="72" fill="#d8faff" font-size="11" font-weight="700">EVALUATE</text><text y="90" fill="#64748b" font-size="8.5">VERIFY</text></g>
  <g transform="translate(1070 205)"><circle r="42" fill="#07111f" stroke="#f0c66a" stroke-opacity=".62"/><path d="M-12 9V-9H8L15-2 8 5H-5" fill="none" stroke="#f0c66a"/><text y="72" fill="#d8faff" font-size="11" font-weight="700">SHIP</text><text y="90" fill="#64748b" font-size="8.5">ACCEPT</text></g>
</g>
<path d="M910 156C910 94 812 98 750 122C650 83 485 91 430 148" fill="none" stroke="#f472d0" stroke-opacity=".38" stroke-width="1.4" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;32" dur="4s" repeatCount="indefinite"/></path>
<g font-family="IBM Plex Mono,JetBrains Mono,ui-monospace,monospace"><rect x="535" y="91" width="140" height="28" rx="7" fill="#130b1b" stroke="#f472d0" stroke-opacity=".35"/><text x="605" y="109" text-anchor="middle" fill="#f472d0" font-size="9" letter-spacing="1.4">REPAIR / RETRY</text><text x="42" y="386" fill="#53657a" font-size="9.5" letter-spacing="1.5">THE LOOP IS THE PRODUCT: EXECUTION IS NOT COMPLETE UNTIL THE OUTCOME IS OBSERVED AND JUDGED.</text></g>
<rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="url(#edge)" stroke-opacity=".4"/>
</svg>